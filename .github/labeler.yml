"db:eshop_db":
  - changed-files:
      - any-glob-to-any-file: "db/eshop_db/**"
"db:crm_db":
  - changed-files:
      - any-glob-to-any-file: "db/crm_db/**"
"db:sklad_db":
  - changed-files:
